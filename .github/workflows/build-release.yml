name: Release
on:
  release:
    types: [published]
jobs:
  libjxlWindows:
    name: Build libjxl Windows
    runs-on: windows-2025
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [x64-windows, arm64-windows]
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 2
    - name: Build libjxl
      run: |
        .\Build.ps1 ${{ matrix.arch }} .\libjxl\
    - name: Upload dlls
      uses: actions/upload-artifact@v7
      with:
        name: libjxl-${{ matrix.arch }}
        compression-level: 0
        path: |
          libjxl/build-${{ matrix.arch }}/lib/Release/*.dll
          libjxl/build-${{ matrix.arch }}/third_party/brotli/Release/*.dll
  libjxlLinux:
    name: Build libjxl Linux
    runs-on: ${{ matrix.variant.runner }}
    strategy:
      matrix:
        variant:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 2
    - name: Create SysRoot
      uses: ./.github/actions/create-sysroot
      with:
        platform: ${{ matrix.variant.platform }}
    - name: Build libjxl
      run: |
        ./Build.sh ${{ matrix.variant.platform }} ./libjxl/
    - name: Upload sos
      uses: actions/upload-artifact@v7
      with:
        name: libjxl-${{ matrix.variant.platform }}
        compression-level: 0
        path: |
          libjxl/build-${{ matrix.variant.platform }}/lib/*.so
          libjxl/build-${{ matrix.variant.platform }}/third_party/brotli/*.so
  build:
    name: NuGet
    runs-on: windows-2025
    needs:
      - libjxlWindows
      - libjxlLinux
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Prepare Env
      uses: microsoft/setup-msbuild@v3
    - name: Login nuget
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ github.actor }}
    - name: Download libjxl
      uses: actions/download-artifact@v8
      with:
        path: libjxl-dll
    - name: Publish nuget
      run: |
        Get-ChildItem -Path .\libjxl-dll\libjxl-x64-windows\*.dll -File -Recurse | Move-Item -Destination .\JxlNet\runtimes\win-x64\native
        Get-ChildItem -Path .\libjxl-dll\libjxl-arm64-windows\*.dll -File -Recurse | Move-Item -Destination .\JxlNet\runtimes\win-arm64\native
        Get-ChildItem -Path .\libjxl-dll\libjxl-linux-x64\*.so -File -Recurse | Move-Item -Destination .\JxlNet\runtimes\linux-x64\native
        Get-ChildItem -Path .\libjxl-dll\libjxl-linux-arm64\*.so -File -Recurse | Move-Item -Destination .\JxlNet\runtimes\linux-arm64\native
        dotnet pack --configuration Release -p:ContinuousIntegrationBuild=true -p:Deterministic=true
        dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.actor }}/index.json"
        dotnet nuget push "$(Get-ChildItem JxlNet\bin\Release\*.nupkg)" -k ${{ secrets.GITHUB_TOKEN }} --source "github"
        dotnet nuget push "$(Get-ChildItem JxlNet\bin\Release\*.nupkg)" -k ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
    - name: Upload nuget
      uses: actions/upload-artifact@v7
      with:
        name: nupkg
        path: |
          JxlNet/bin/Release/*.nupkg
          JxlNet/bin/Release/*.snupkg
